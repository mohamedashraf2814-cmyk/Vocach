services:
  - type: web
    name: vocach
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/auth/status
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
    disk:
      name: vocach-data
      mountPath: /var/data
      sizeGB: 1
